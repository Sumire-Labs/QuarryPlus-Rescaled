// Publish the reobfuscated jar as the main Maven artifact in both Java variants.
def distributionJar = tasks.named('reobfJar').flatMap { it.output }
[configurations.apiElements, configurations.runtimeElements].each { variant ->
    variant.outgoing.artifacts.removeAll { it.type == 'jar' && !it.classifier }
    variant.outgoing.artifact(distributionJar) {
        type = 'jar'
        extension = 'jar'
    }
}

publishing {
    repositories {
        if (publish_to_maven.toBoolean()) {
            maven {
                name = maven_name.replaceAll('\\s', '')
                url = uri(maven_url)
                credentials {
                    username = project.findProperty('azureUserName') ?:
                        project.findProperty('mavenUser') ?:
                        System.getenv('AZURE_USER_NAME') ?:
                        System.getenv('MAVEN_USER') ?: ''
                    password = project.findProperty('azureToken') ?:
                        project.findProperty('mavenPassword') ?:
                        System.getenv('AZURE_TOKEN') ?:
                        System.getenv('MAVEN_PASS') ?: ''
                }
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            setGroupId(root_package)
            setArtifactId(mod_id)
            version = project.version
        }
    }
}

if (publish_to_local_maven.toBoolean()) {
    tasks.named('build').configure {
        finalizedBy(tasks.named('publishToMavenLocal'))
    }
}
