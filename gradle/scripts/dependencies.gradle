repositories {
    // The historical Cleanroom JEI artifact has no POM and is outside CG's exclusive com.cleanroommc group.
    maven {
        name = 'CleanroomModArtifacts'
        url = 'https://maven.cleanroommc.com'
        content { includeGroup 'mezz' }
        metadataSources { mavenPom(); artifact() }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name 'outlandsReleases'
        url 'https://maven.arcseekers.com/releases'
    }
    maven {
        name = 'CoFHMaven'
        url = 'https://maven.covers1624.net/'
    }
    maven {
        name = 'BuildCraft'
        url = 'https://mod-buildcraft.com/maven'
    }
    maven {
        name = 'IndustrialCraft'
        url = 'https://maven.ic2.player.to/'
    }
    maven {
        name = 'Mekanism'
        url = 'https://maven.thiakil.com/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    mavenCentral()
    if (providers.gradleProperty('cg.repos.enableLocal').orElse('false').get().toBoolean()) mavenLocal()
}

dependencies {
    // LWJGL compatibility is supplied by the selected Cleanroom 0.7 userdev.

    // Use the real Scala 3.9 provider: the Maven 1.0.0 stub disables its Mod container in development.
    runtimeOnly(deobf("curse.maven:scalar-1012168:${scalar_file}")) {
        transitive = false
    }

    // Original CleanroomMC ModularUI, rather than a third-party fork.
    implementation(deobf('com.cleanroommc:modularui:3.1.6')) {
        transitive = false // Cleanroom supplies Mixin; optional UI integrations are not mandatory mods.
    }
    // Zinc inspects ModularContainer's public optional sorting API during Java/Scala joint compilation.
    compileOnly(deobf('curse.maven:inventory-bogosorter-632327:7412409')) {
        transitive = false
    }
    compileOnly(deobf('curse.maven:neverenoughanimation-1062347:6533650')) {
        transitive = false
    }

    // Remap the SRG distribution; IC2's dev classifier uses older MCP names (e.g. mcDataDir).
    implementation deobf('net.industrial-craft:industrialcraft-2:2.8.221-ex112')
    implementation deobf('cofh:RedstoneFlux:1.12-2.1.0.7:universal')
    implementation(deobf('cofh:CoFHCore:1.12.2-4.6.3.27:universal')) {
        // Use the Cleanroom JEI declared below instead of CoFHCore's older upstream API.
        exclude group: 'mezz.jei', module: 'jei_1.12.2'
    }
    // Remap the distribution (including its access transformer) instead of injecting the dev jar.
    implementation deobf('mezz:jei:4.35.0@jar')
    implementation deobf('com.mod-buildcraft:buildcraft-main:7.99.24.7')

    compileOnly deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.605')
    compileOnly 'CraftTweaker2:CraftTweaker2-API:4.1.20.605'
    compileOnly 'CraftTweaker2:ZenScript:4.1.20.605'
    compileOnly(deobf('mekanism:Mekanism:1.12.2-9.4.4.330+0b21085')) {
        // Only Mekanism's API is needed; its POM pulls obsolete runtime JEI/CTM/CraftTweaker versions.
        transitive = false
    }
    compileOnly deobf('curse.maven:bedrockores-275083:2602707')

}
