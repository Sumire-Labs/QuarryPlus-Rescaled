# Build and versioning
org.gradle.jvmargs = -Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching = true
versioning.releaseBranch = 1.12
versioning.stageInVersion = true

# Mod information
root_package = com.yogpc.qp
mod_id = quarryplus
mod_name = QuarryPlus Rescaled
mod_archive_name = AdditionalEnchantedMiner-Rescaled
mod_description = This mod adds advanced quarries and more.
mod_url = https://github.com/Sumire-Labs/QuarryPlus-Rescaled
mod_update_json =
mod_authors = yogpstop(Original QuarryPlus), Kotori316(Additional Enchanted Miner), Sumire Labs(Rescaled)
mod_credits =
mod_logo_path = assets/quarryplus/icon.png
mod_issue_tracker = https://github.com/Sumire-Labs/QuarryPlus-Rescaled/issues

# Native Cleanroom userdev and Scala runtime/compiler
cleanroom_version = 0.7.14-alpha
scala_version = 3.9.0
scalar_file = 8800375

# Optional template features
# This project has no Mixins, access transformers or coremod.
enable_mixin = false
cg.userdev.refmap = quarryplus.refmap.json
access_transformers =
coremod_plugin_class =
coremod_includes_mod = true
enable_shadow = false
enable_spotless = false
use_asset_mover = false
asset_mover_version = 3.0.1

generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = true
show_testing_output = false

# Development runs
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false
enable_mixin_debug = false

# Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = TemplateMaven
maven_url =
curseforge_project_id =
modrinth_project_id =
