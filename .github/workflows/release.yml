name: Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example 13.0.0 or 13.0.1)'
        required: true
        type: string
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - name: Checkout tagged sources
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Execute Gradle build
        run: |
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" ./gradlew clean build verifyReleaseJar writeReleaseMetadata \
            --init-script "$GITHUB_WORKSPACE/release-tools/gradle/release-verification.init.gradle" \
            -Prelease_verification_script="$GITHUB_WORKSPACE/release-tools/gradle/scripts/verify-release.gradle"

      - name: Read release metadata
        id: metadata
        run: cat build/release-metadata.properties >> "$GITHUB_OUTPUT"

      - name: Select release artifacts
        shell: bash
        run: |
          mkdir -p build/release
          for artifact in build/libs/*.jar; do
            case "$artifact" in
              *-dev.jar|*-shadow.jar) continue ;;
            esac
            cp "$artifact" build/release/
          done

      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: "source/build/release/*.jar"
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          prerelease: ${{ steps.metadata.outputs.stage != 'release' }}
