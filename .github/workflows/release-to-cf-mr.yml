name: Releases to CurseForge and/or Modrinth

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example 13.0.0-alpha)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - uses: gradle/actions/setup-gradle@v6
        name: Set up Gradle
        
      - name: Add permission
        run: chmod +x ./gradlew
        
      - name: Execute Gradle build
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" ./gradlew build writeReleaseMetadata

      - name: Read release version and stage
        id: version
        run: cat build/release-metadata.properties >> "$GITHUB_OUTPUT"

      - name: Get Changes between Tags
        run: |
          previous=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            git log --format='- %s (%h)' "$previous..HEAD" > build/release-changelog.md
          else
            git log --format='- %s (%h)' HEAD > build/release-changelog.md
          fi

      - uses: Kir-Antipov/mc-publish@v3
        with:
          # Only include this section if you wish to publish
          # your assets on Modrinth.
          modrinth-id: placeholder
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Only include this section if you wish to publish
          # your assets on CurseForge.
          curseforge-id: placeholder
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
          loaders: forge
          game-versions: 1.12.2
          java: |
            25
          version: ${{ steps.version.outputs.version }}
          # CurseForge and Modrinth represent release candidates as beta builds.
          version-type: ${{ steps.version.outputs.stage == 'rc' && 'beta' || steps.version.outputs.stage }}
          changelog-file: build/release-changelog.md
